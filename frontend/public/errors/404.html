<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Страница или запись не найдена · ИТ Школа Ростелекома</title>
    <link rel="stylesheet" href="/errors/errors.css" />
  </head>
  <body>
    <main>
      <img class="logo" src="/errors/logo.svg" alt="Ростелеком. ИТ Школа" />
      <p class="number" aria-hidden="true">404</p>
      <h1>Страница или запись не найдена</h1>
      <p class="hint">Возможно, запись удалена или ссылка устарела. Вернитесь к списку и найдите её через поиск.</p>
      <div class="actions">
        <a class="button primary" href="/">На главную</a>
      </div>
      <p class="code">Код ошибки: NOT-FOUND-404 — назовите его поддержке, так причину найдут быстрее.</p>
    </main>
  </body>
</html>
