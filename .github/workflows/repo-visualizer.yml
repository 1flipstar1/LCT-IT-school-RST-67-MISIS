name: Repository visualization

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  visualize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create diagram directory
        run: mkdir -p docs

      - name: Generate repository diagram
        uses: githubocto/repo-visualizer@0.9.1
        with:
          output_file: "docs/repository-diagram.svg"
          excluded_paths: "node_modules,dist,build,.git"
          root_path: ""
          max_depth: 8
          should_push: true
          commit_message: "docs: update repository diagram [skip ci]"
