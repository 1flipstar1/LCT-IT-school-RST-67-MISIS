services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-it-school}
        VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-rtk-it-school-web}

    restart: unless-stopped

    environment:
      APP_ENV: demo

      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/lct_db

      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-at-least-32-bytes}

      CORS_ORIGINS: http://localhost:8000,http://localhost:5173

      ATTACHMENT_STORAGE_PATH: /app/data/attachments

      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-http://keycloak:8080/realms/it-school}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-rtk-it-school-web}

    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

    ports:
      - "8000:8000"

    volumes:
      - attachment_data:/app/data/attachments

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lct_db

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lct_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:latest

    command: start-dev

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

    ports:
      - "8080:8080"

    restart: unless-stopped

volumes:
  postgres_data:
  attachment_data:
