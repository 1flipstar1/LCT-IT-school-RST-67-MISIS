services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: demo
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/lct_db
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me}
      CORS_ORIGINS: http://localhost:8000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lct_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lct_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
